name: Publish YouTube Short

on:
  schedule:
    # Run 4x daily, spaced 6 hours apart: 06:00, 12:00, 18:00, 00:00 PKT
    # (01:00, 07:00, 13:00, 19:00 UTC) -> morning, afternoon, evening, night
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  publish:
    name: Generate & Publish Short
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Upload Run Reports & Metadata Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-artifacts
          path: |
            output/reports/
            output/metadata/
